; SingularityVR.ini - the shipped configuration.
;
; This file is PARTIAL on purpose. The mod reads about 111 settings; the ones here
; are the deliberate choices and the ones worth tuning. Anything absent takes the
; code's own default, which is the value every tested run used.
;
; Delete a line and you get the code default back. Delete the file and the mod
; still runs - you lose the per-weapon gun alignment below, which is the only
; thing here you cannot easily re-derive.
;
; AutoResX/AutoResY are the mod's cache of the headset's size. It writes them
; itself on first launch and injects them from the second onward, because the DLL
; loads before the game reads its command line and asking the headset that early
; would put XR startup in the process-launch path. The values shipped here are a
; sensible VR-shaped starting point; yours will replace them after one run.

[Render]
Debug=0
AutoResX=4224
AutoResY=2304
StartInVr=1
HideCrosshair=1
HideMuzzleFx=1
WorldScalePct=100
WeaponFxRideGun=1
OcclusionQueryMode=2

; How big an open NOTE is, as a percent of the game's own layout, scaled about the
; centre of the eye. The game draws a note across the entire screen, which reads
; fine on a monitor and badly in a headset - at full size its edges sit out in the
; periphery and you end up moving your head along each line to read it. 100 turns
; this off and gives you the original layout. Also on the panel: DISPLAY page,
; NOTE SIZE. 40 is the value that read comfortably in a headset when this was
; tuned; adjust it there with a note open rather than guessing here.
NoteInsetPct=40

; The laser sight. A line along the bullet's real path, from the gun's rotation
; point. Toggle it in game by holding A for a second, or from the panel's DISPLAY
; page - either route writes the value back here. It switches itself off while the
; sniper scope is up, which has its own reticle.
LaserSight=1

; Aiming. The game's own aim animation slides the weapon toward the centre of the
; screen, which is right in head mode and meaningless on a hand-held gun.
; AdsMaskAnim holds that animation still; AdsPullbackUU (under [Input]) replaces
; it with a pull back along the line the gun is already pointing.
;
; The mask suppresses recoil and reload motion WHILE AIMING. That is the trade,
; not a bug - set AdsMaskAnim=0 for the game's own behaviour.
; AdsMaskLo/Hi is the bone range that carries the weapon, measured on the assault
; rifle. If another weapon looks wrong while aiming, that range is the first
; suspect.
AdsMaskAnim=1
AdsMaskLo=5
AdsMaskHi=22
AdsMaskTailMs=400

; Diagnostics. Investigation tools, shipped off. Each one costs work while it is
; armed, so leave them alone unless you are chasing something.
DropPrimCount=0
ScopeQuadDump=0
ScopeDrawCensus=0
AdsConstDump=0
AdsFreezeLo=-1
AdsFreezeHi=-1

[Input]
AimMethod=1
TurnMode=2
TurnSpeed=120
TurnAngle=30
TurnSign=1
WalkDirection=0
SwapSticks=0
LeftHanded=0
CutsceneStickTurn=2
CutsceneLockCamera=0
AimModeParts=3

; ---- where the gun sits, and what it turns about ----
;
; The anchor is the point the gun hangs from AND the point it rotates about, in
; engine units from your eye: forward, right, up. It is also where the laser
; starts. This is the GLOBAL anchor - the per-weapon block below overrides it for
; any weapon listed there.
GunAnchorFwd=30
GunAnchorRight=9
GunAnchorUp=-13

; The gun follows your hand's position as well as its rotation.
GunFollowPosition=1
; ...and is anchored to YOUR head rather than the engine's eye, so leaning and
; recentring do not slide it against the view.
GunFollowsHeadOffset=1

; Rotation signs. These were found empirically and every working run has used
; these values - see the note in STATUS about not "reasoning" them to a different
; combination. Change them only if the gun turns the wrong way about an axis.
GunSignYaw=1
GunSignPitch=1
GunSignRoll=1
GunSignCombo=2
GunSignPosZ=-1

; How far aiming pulls the weapon back along the line it is pointing. The sight
; picture does not move - the line is unchanged, the gun is just nearer. Only
; meaningful with AdsMaskAnim=1; without it you get this AND the game's animation.
AdsPullbackUU=10

; ---- per-weapon alignment ----
;
; Measured in the headset against the laser sight. A weapon is identified by its
; first-person vertex count, which is the same number on every copy of the game,
; so these transfer. A slot here overrides the built-in value for that weapon.
;
; Tune from the panel: hold Y, WEAPON ALIGN, adjust with the stick, close it.
; Fwd/Right/Up are the anchor for that weapon; YawTenths/PitchTenths trim the
; barrel in TENTHS of a degree (30 = +3.0 deg) so the barrel lines up with the
; laser. The trim moves the MESH only and can never change where a shot goes.
;
; The sniper is aligned against its own SCOPE RETICLE rather than the laser - the
; laser switches itself off behind the scope, but the reticle is just as good a
; reference and scoped aim already tracks it.
;
;   11387  assault rifle
GunAlign0Verts=11387
GunAlign0Fwd=26
GunAlign0Right=8
GunAlign0Up=-13
GunAlign0YawTenths=30
GunAlign0PitchTenths=-28
;   8297   shotgun
GunAlign1Verts=8297
GunAlign1Fwd=30
GunAlign1Right=10
GunAlign1Up=-13
GunAlign1YawTenths=30
GunAlign1PitchTenths=0
;   5799   pistol
GunAlign2Verts=5799
GunAlign2Fwd=30
GunAlign2Right=9
GunAlign2Up=-13
GunAlign2YawTenths=10
GunAlign2PitchTenths=0
;   11389  sniper
GunAlign3Verts=11389
GunAlign3Fwd=30
GunAlign3Right=13
GunAlign3Up=-13
GunAlign3YawTenths=43
GunAlign3PitchTenths=0
; Free slots. Set Verts to a weapon's vertex count to tune it, or use the panel.
GunAlign4Verts=0
GunAlign5Verts=0
GunAlign6Verts=0
GunAlign7Verts=0
